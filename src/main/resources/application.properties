# Configuración del servidor
spring.application.name=stockflow
server.port=8081

# Conexión a POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5432/stockflow
spring.datasource.username=postgres
spring.datasource.password=tu_password //AUN NO REALIZADO, LO HAREMOS CUANDO DOCKERIZEMOS LA BASE DE DATOS
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA e inicialización
# para que hibernate no modifique la base de datos, ya que la inicializamos con el script schema.sql
spring.jpa.hibernate.ddl-auto=none
# para siempre inicializar la base de datos con el script schema.sql
spring.sql.init.mode=always
# para ver consultas en consola
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
