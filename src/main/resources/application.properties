# Configuracion del servidor
spring.application.name=stockflow
server.port=${SERVER_PORT:8081}

# Codificacion UTF-8 estricta para HTTP y plantillas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Carga nativa de Spring Boot para archivo .env (sin codigo Java adicional)
spring.config.import=optional:file:.env[.properties]

# Conexion a POSTGRESQL (con fallback por defecto si no existe .env)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockflow}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e inicializacion
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
