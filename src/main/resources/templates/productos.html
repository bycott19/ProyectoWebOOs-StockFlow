<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments :: head('StockFlow - Productos')}"></head>

<body>

    <header th:replace="~{fragments :: header('prod')}"></header>

    <main>
        <div class="hero h2">
            <div>
                <h1>Productos</h1>
                <p>Catálogo e inventario de GlobalRetail S.A.</p>
            </div>
            <button class="btn o" onclick="abrirModalCrear()">+ Agregar producto</button>
        </div>

        <div class="tools">
            <input type="text" id="busqueda" class="in f" placeholder="Buscar por SKU, nombre o categoría..."
                onkeyup="filtrarTabla()">
            <a th:href="@{/stock-bajo}" class="btn o">Filtrar con stock bajo</a>
        </div>

        <div class="card tw">
            <table id="tablaProductos">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Mínimo</th>
                        <th>Nivel</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="9" style="text-align:center; padding: 20px; color: var(--mu);">No hay productos en
                            el inventario</td>
                    </tr>
                    <tr th:each="p : ${productos}">
                        <td><b th:text="${p.sku}">SKU-001</b></td>
                        <td>
                            <strong th:text="${p.nombre}">Nombre</strong>
                            <div th:if="${p.descripcion}" style="font-size:12px; color:var(--mu);"
                                th:text="${p.descripcion}"></div>
                        </td>
                        <td th:text="${p.categoria != null ? p.categoria : '-'}">Periféricos</td>
                        <td><b th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'POINT', 0, 'POINT')}">$0</b></td>
                        <td><b th:text="${p.stockActual}">0</b></td>
                        <td th:text="${p.stockMinimo}">0</td>
                        <td>
                            <div class="bar">
                                <i
                                    th:style="'width: ' + ${p.stockMinimo > 0 ? (p.stockActual >= p.stockMinimo ? '100%' : (p.stockActual * 100 / p.stockMinimo) + '%') : '100%'} + '; background: ' + ${p.stockActual < p.stockMinimo ? 'var(--co)' : (p.stockActual <= p.stockMinimo * 1.5 ? 'var(--mus)' : 'var(--te)')}"></i>
                            </div>
                        </td>
                        <td>
                            <span class="tag"
                                th:classappend="${p.stockActual < p.stockMinimo ? 'er' : (p.stockActual <= p.stockMinimo * 1.5 ? 'wa' : 'ok')}"
                                th:text="${p.stockActual < p.stockMinimo ? 'Bajo' : (p.stockActual <= p.stockMinimo * 1.5 ? 'Atención' : 'Normal')}">Normal</span>
                        </td>
                        <td>
                            <div style="display:flex; gap:6px;">
                                <button class="btn o sm" th:data-id="${p.id}" th:data-sku="${p.sku}"
                                    th:data-nombre="${p.nombre}" th:data-categoria="${p.categoria}"
                                    th:data-precio="${p.precio}" th:data-stock="${p.stockActual}"
                                    th:data-minimo="${p.stockMinimo}" th:data-desc="${p.descripcion}"
                                    onclick="abrirModalEditar(this)">Editar</button>
                                <form th:action="@{'/productos/' + ${p.id} + '/eliminar'}" method="post"
                                    onsubmit="return confirm('¿Seguro que deseas eliminar este producto?')">
                                    <button type="submit" class="btn danger sm">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Crear / Editar Producto -->
    <div id="modalProducto" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modalTitulo" style="margin-bottom: 16px;">Nuevo Producto</h2>
            <form id="formProducto" th:action="@{/productos/guardar}" method="post">
                <input type="hidden" id="prodId" name="id">

                <label>SKU (Código único)</label>
                <input type="text" id="prodSku" name="sku" class="fld" required placeholder="Ej: TEC-001">

                <label>Nombre del Producto</label>
                <input type="text" id="prodNombre" name="nombre" class="fld" required
                    placeholder="Ej: Teclado Mecánico RGB">

                <label>Categoría</label>
                <input type="text" id="prodCategoria" name="categoria" class="fld" placeholder="Ej: Periféricos">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div>
                        <label>Precio ($ CLP)</label>
                        <input type="number" step="0.01" min="0" id="prodPrecio" name="precio" class="fld" required
                            placeholder="49990">
                    </div>
                    <div>
                        <label>Stock Actual</label>
                        <input type="number" min="0" id="prodStock" name="stockActual" class="fld" required
                            placeholder="10">
                    </div>
                </div>

                <label>Stock Mínimo (Umbral de alerta)</label>
                <input type="number" min="0" id="prodMinimo" name="stockMinimo" class="fld" required placeholder="5">

                <label>Descripción (Opcional)</label>
                <textarea id="prodDesc" name="descripcion" class="fld" rows="2"
                    placeholder="Detalles técnicos..."></textarea>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
                    <button type="button" class="btn o" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function abrirModalCrear() {
            document.getElementById('modalTitulo').innerText = 'Nuevo Producto';
            document.getElementById('formProducto').reset();
            document.getElementById('prodId').value = '';
            document.getElementById('modalProducto').classList.add('open');
        }

        function abrirModalEditar(btn) {
            document.getElementById('modalTitulo').innerText = 'Editar Producto';
            document.getElementById('prodId').value = btn.dataset.id;
            document.getElementById('prodSku').value = btn.dataset.sku;
            document.getElementById('prodNombre').value = btn.dataset.nombre;
            document.getElementById('prodCategoria').value = btn.dataset.categoria || '';
            document.getElementById('prodPrecio').value = btn.dataset.precio;
            document.getElementById('prodStock').value = btn.dataset.stock;
            document.getElementById('prodMinimo').value = btn.dataset.minimo;
            document.getElementById('prodDesc').value = btn.dataset.desc || '';
            document.getElementById('modalProducto').classList.add('open');
        }

        function cerrarModal() {
            document.getElementById('modalProducto').classList.remove('open');
        }

        function filtrarTabla() {
            const q = document.getElementById('busqueda').value.toLowerCase();
            const filas = document.querySelectorAll('#tablaProductos tbody tr');
            filas.forEach(f => {
                const texto = f.innerText.toLowerCase();
                f.style.display = texto.includes(q) ? '' : 'none';
            });
        }
    </script>

</body>

</html>
